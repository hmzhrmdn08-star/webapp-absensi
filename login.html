<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — SMK Bina Informatika XI-2 TJKT</title><link rel="stylesheet" href="style.css"><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"></head><body class="login-body"><div class="scanline-overlay" id="scanlines"></div><div class="pixel-box"><div class="avatar-anim">👨‍💻</div><h1>SMK BINA INFORMATIKA</h1><span class="sub">&gt;&gt;&gt; GATEWAY LOGIN KELAS XI-2 TJKT &lt;&lt;&lt;</span><div class="error-msg" id="loginError" hidden></div><form id="loginForm"><div class="form-group"><label for="email">&gt; EMAIL ADMIN</label><input id="email" name="email" type="email" autocomplete="username" required></div><div class="form-group"><label for="password">&gt; PASSWORD</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button class="btn-submit" type="submit" id="loginButton">LOGIN KE DASHBOARD &gt;&gt;</button></form><p class="login-hint">Gunakan email dan password admin yang dibuat di Supabase.</p><p class="login-hint warning">Akun admin dibuat dari dashboard Supabase. Pendaftaran publik tidak tersedia.</p></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const err=document.getElementById('loginError'),form=document.getElementById('loginForm'),btn=document.getElementById('loginButton');
if(!window.supabase||!window.APP_CONFIG||!window.APP_CONFIG.SUPABASE_ANON_KEY||window.APP_CONFIG.SUPABASE_ANON_KEY.includes('TEMPEL_')){err.hidden=false;err.textContent='Isi SUPABASE_URL dan SUPABASE_ANON_KEY di supabase-config.js terlebih dahulu.';btn.disabled=true;}else{const sb=window.supabase.createClient(window.APP_CONFIG.SUPABASE_URL,window.APP_CONFIG.SUPABASE_ANON_KEY);sb.auth.getSession().then(({data})=>{if(data.session)location.href='index.html'});form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='MEMERIKSA AKUN…';err.hidden=true;const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {data,error}=await sb.auth.signInWithPassword({email,password});if(error){err.hidden=false;err.textContent='Login gagal. Periksa email/password atau akun Supabase.';btn.disabled=false;btn.textContent='LOGIN KE DASHBOARD >>';return}sessionStorage.setItem('smkLoggedIn','true');sessionStorage.setItem('smkName',data.user.email||'Administrator');location.href='index.html'});}
</script></body></html>
