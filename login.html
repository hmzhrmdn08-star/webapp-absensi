<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — SMK Bina Informatika XI-2 TJKT</title><link rel="stylesheet" href="style.css"><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"></head><body class="login-body"><div class="scanline-overlay" id="scanlines"></div><div class="pixel-box"><div class="avatar-anim">👨‍💻</div><h1>SMK BINA INFORMATIKA</h1><span class="sub">&gt;&gt;&gt; GATEWAY LOGIN KELAS XI-2 TJKT &lt;&lt;&lt;</span><div class="error-msg" id="loginError" hidden></div><form id="loginForm"><div class="form-group"><label for="username">&gt; USERNAME ADMINISTRATOR</label><input id="username" name="username" autocomplete="username" required></div><div class="form-group"><label for="password">&gt; PASSWORD SYSTEM</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button class="btn-submit" type="submit">LOGIN KE DASHBOARD &gt;&gt;</button></form><p class="login-hint">Demo lokal: admin / admin123</p><p class="login-hint warning">Versi statis: login hanya simulasi di browser ini, bukan autentikasi aman untuk data publik.</p></div><script>if(sessionStorage.getItem('smkLoggedIn')==='true')location.href='index.html';document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value;const err=document.getElementById('loginError');if(u==='admin'&&p==='admin123'){sessionStorage.setItem('smkLoggedIn','true');sessionStorage.setItem('smkName','Administrator');location.href='index.html'}else{err.hidden=false;err.textContent='⚠️ Username atau password tidak cocok.'}});</script></body></html>
